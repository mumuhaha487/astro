{{ define "main" }}
  {{ if eq .Section "posts" }}
    {{ partial "blog-list.html" . }}
  {{ else }}
  <section class="content-page">
    <header class="page-heading"><p>COLLECTION</p><h1>{{ .Title }}</h1>{{ with .Description }}<span>{{ . }}</span>{{ end }}</header>
    <div class="post-grid">
      {{ range .Pages.ByDate.Reverse }}{{ partial "post-card.html" (dict "page" .) }}{{ else }}<div class="empty-state">这里暂时没有内容。</div>{{ end }}
    </div>
  </section>
  {{ end }}
{{ end }}
