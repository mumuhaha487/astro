baseURL: https://vmss.cn/
locale: zh-CN
defaultContentLanguage: zh
hasCJKLanguage: true
title: Mumuemhaha Blog
theme: mumuemhaha
publishDir: dist
staticDir: public
enableRobotsTXT: true
enableGitInfo: false
summaryLength: 48
taxonomies:
  tag: tags
  category: category

pagination:
  pagerSize: 8
  path: page

permalinks:
  posts: /posts/:contentbasename/

frontmatter:
  date:
    - published
    - date
  lastmod:
    - updated
    - :git
    - published

markup:
  goldmark:
    parser:
      attribute:
        block: true
        title: true
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false

outputs:
  home:
    - HTML
    - RSS
    - PostManifest

mediaTypes:
  application/vnd.mumuemhaha.posts+json:
    suffixes:
      - json

outputFormats:
  PostManifest:
    mediaType: application/vnd.mumuemhaha.posts+json
    baseName: post-manifest
    isPlainText: true
    notAlternative: true

params:
  description: 木哈文轩
  author: 木木em哈哈
  siteStartDate: 2023-04-01
  wallpapers:
    desktop:
      - /assets/desktop-banner/1.webp
      - /assets/desktop-banner/2.webp
      - /assets/desktop-banner/3.webp
      - /assets/desktop-banner/4.webp
      - /assets/desktop-banner/5.webp
      - /assets/desktop-banner/6.webp
    mobile:
      - /assets/mobile-banner/1.webp
      - /assets/mobile-banner/2.webp
      - /assets/mobile-banner/3.webp
      - /assets/mobile-banner/4.webp
      - /assets/mobile-banner/5.webp
      - /assets/mobile-banner/6.webp
  covers:
    desktop:
      - /image/h/132.webp
      - /image/h/694.webp
      - /image/h/129.webp
      - /image/h/865.webp
      - /image/h/276.webp
      - /image/h/416.webp
    mobile:
      - /image/v/2870.webp
      - /image/v/1878.webp
      - /image/v/2675.webp
      - /image/v/1769.webp
      - /image/v/1779.webp
      - /image/v/1127.webp
