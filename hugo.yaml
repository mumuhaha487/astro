baseURL: https://vmss.cn/
locale: zh-CN
defaultContentLanguage: zh
hasCJKLanguage: true
title: Mumuemhaha Blog
theme: mumuemhaha
publishDir: dist
staticDir: public
enableRobotsTXT: true
enableGitInfo: false
summaryLength: 48
taxonomies:
  tag: tags
  category: category

pagination:
  pagerSize: 8
  path: page

permalinks:
  posts: /posts/:contentbasename/

frontmatter:
  date:
    - published
    - date
  lastmod:
    - updated
    - :git
    - published

markup:
  goldmark:
    parser:
      attribute:
        block: true
        title: true
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false

outputs:
  home:
    - HTML
    - RSS
    - PostManifest

mediaTypes:
  application/vnd.mumuemhaha.posts+json:
    suffixes:
      - json

outputFormats:
  PostManifest:
    mediaType: application/vnd.mumuemhaha.posts+json
    baseName: post-manifest
    isPlainText: true
    notAlternative: true

params:
  description: 木哈文轩
  author: 木木em哈哈
  siteStartDate: 2023-04-01
