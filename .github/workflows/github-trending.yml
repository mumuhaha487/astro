name: Update GitHub Trending

on:
  schedule:
    - cron: "0 5 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-trending-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install parser
        run: npm ci --ignore-scripts --omit=dev
      - name: Verify ranking and deduplication
        run: node --test scripts/update-github-trending.test.mjs scripts/update-github-trending-periods.test.mjs scripts/github-trending-ui.test.mjs
      - name: Backfill AI categories
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/backfill-github-trending-tags.mjs
      - name: Generate trending data with retries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          attempt=1
          while true; do
            echo "Generation attempt $attempt"
            if node scripts/update-github-trending.mjs && node scripts/update-github-trending-periods.mjs; then
              exit 0
            fi
            delay=$((attempt * 60))
            if [ "$delay" -gt 900 ]; then delay=900; fi
            echo "Generation failed; retrying in $delay seconds."
            sleep "$delay"
            attempt=$((attempt + 1))
          done
      - name: Commit dated snapshot and articles
        run: |
          git add content/github-trending data/github_trending data/github_trending_periods public/api/github-trending-search.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: update GitHub trending $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
