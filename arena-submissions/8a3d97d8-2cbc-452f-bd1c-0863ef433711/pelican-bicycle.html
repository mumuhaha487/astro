<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f1e6">
<title>鹈鹕的海边骑行</title>
<style>
  :root{color-scheme:light;--paper:#f6f1e6;--ink:#23494c;--muted:#708681;--accent:#d7674f}
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper)}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
  main{width:min(1180px,100%);margin:auto;padding:28px 42px 25px}
  header{display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:11px;letter-spacing:2.1px;font-weight:600}
  .wordmark{display:flex;gap:11px;align-items:center}.wordmark svg{width:28px;height:28px;flex-shrink:0}
  .edition{color:var(--muted);font-size:10px;white-space:nowrap}
  .art{position:relative;margin:4px -22px 0}.scene{display:block;width:100%;height:auto;overflow:visible}
  footer{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:0 17px;margin-top:-20px}
  h1{font-size:clamp(22px,3.2vw,37px);font-weight:500;letter-spacing:4px;margin:0 0 11px}
  .caption{font-family:Georgia,serif;font-style:italic;font-size:14px;letter-spacing:1px;color:var(--muted);margin:0}
  .actions{display:flex;align-items:center;gap:11px;padding-bottom:4px}
  button{appearance:none;background:transparent;border:1px solid #bdc9bc;color:var(--ink);border-radius:50%;width:43px;height:43px;padding:11px;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .2s}
  button:hover{background:#e6ebdf;transform:translateY(-2px)}button:focus-visible,#bell:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
  button svg{display:block;width:20px;height:20px}.tip{font-size:11px;letter-spacing:1px;color:var(--muted);margin-right:6px}
  #bell{cursor:pointer;outline:none}.bell-hit{fill:transparent;stroke:none}.bell-rings{opacity:0}
  .ink{stroke:#294b4c;stroke-linecap:round;stroke-linejoin:round}.fine{stroke-width:2}.medium{stroke-width:3}.bold{stroke-width:4}
  .breeze{stroke:#8ab2ab;stroke-width:2;fill:none;stroke-linecap:round}.wheel-spokes{stroke:#9aaba0;stroke-width:1.65}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media(min-width:1500px){main{width:min(1300px,100%);padding-top:36px}}
  @media(max-width:650px){main{padding:23px 17px 28px}header{letter-spacing:1px;font-size:9px}.edition{font-size:8px}.art{margin:32px -13px 22px}footer{margin:0;padding:0 7px;align-items:center}h1{letter-spacing:2px}.caption{font-size:11px;letter-spacing:.2px}.tip{display:none}.actions{gap:8px}button{width:37px;height:37px;padding:8px}}
</style>
</head>
<body>

  <div class="art">

  </div>
  <footer>
    <div><h1>今天，去兜风。</h1><p class="caption">Nowhere to rush. Just enjoy the ride.</p></div>

    </div>
  </footer>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  let paused = reduced.matches, elapsed = .12, lastTime = null, raf = 0, bellTime = -10;
  let audioContext;
  const nodes = Object.fromEntries(['rear-spokes','front-spokes','cranks','far-leg-outline','far-leg-color','near-leg-outline','near-leg-color','far-foot','near-foot','pelican','eye','clouds','ripples','breeze','scarf-upper','scarf-lower','plant-left','plant-right','road-dashes','bell-rings'].map(id => [id, byId(id)]));
  const setTransform = (id, value) => nodes[id].setAttribute('transform', value);
  // Two rigid leg segments bend at a computed knee, keeping each foot on its pedal.
  function leg(side, hipX, hipY, angle) {
    const footX = 577 + 36 * Math.cos(angle), footY = 628 + 36 * Math.sin(angle) - 10;
    const dx = footX - hipX, dy = footY - hipY;
    const distance = Math.hypot(dx, dy), thigh = 100, shin = 103;
    const along = (thigh*thigh - shin*shin + distance*distance) / (2*distance);
    const bend = Math.sqrt(Math.max(0, thigh*thigh - along*along));
    const kneeX = hipX + along * dx / distance + bend * dy / distance;
    const kneeY = hipY + along * dy / distance - bend * dx / distance;
    const d = `M${hipX} ${hipY}Q${kneeX} ${kneeY} ${kneeX} ${kneeY}L${footX} ${footY}`;
    nodes[side+'-leg-outline'].setAttribute('d',d);
    nodes[side+'-leg-color'].setAttribute('d',d);
    setTransform(side+'-foot', `translate(${footX} ${footY})`);
  }
  function draw(t) {
    const angle = t * Math.PI, degrees = t * 180;
    const bob = Math.sin(angle*2)*1.35;
    setTransform('rear-spokes', `rotate(${degrees * 1.45})`);
    setTransform('front-spokes', `rotate(${degrees * 1.45})`);
    nodes.cranks.setAttribute('transform', `rotate(${degrees} 577 628)`);
    leg('far',503,469+bob,angle+Math.PI);
    leg('near',530,470+bob,angle);
    setTransform('pelican', `translate(0 ${bob})`);
    const blinkCycle = t % 5.7;
    const blink = blinkCycle > 5.35 && blinkCycle < 5.55 ? Math.max(.08,Math.abs(blinkCycle-5.45)*10) : 1;
    setTransform('eye', `translate(632 228) scale(1 ${blink})`);
    setTransform('clouds', `translate(${-Math.sin(t*.12)*15} 0)`);
    setTransform('ripples', `translate(${Math.sin(t*.6)*8} 0)`);
    nodes.breeze.style.opacity = .65 + Math.sin(t*1.1)*.2;
    setTransform('plant-left', `rotate(${Math.sin(t*1.5)*1.2} 194 691)`);
    setTransform('plant-right', `rotate(${Math.sin(t*1.5+1)*1.4} 1040 691)`);
    setTransform('road-dashes', `translate(${-((t*65)%130)} 0)`);
    const flutter = Math.sin(t*5)*7;
    nodes['scarf-upper'].setAttribute('d',`M594 331C542 321 525 ${304+flutter} 492 ${311+flutter}Q457 ${321-flutter} 422 ${299-flutter}L435 ${324-flutter} 416 ${340-flutter}Q466 ${358+flutter} 501 ${339+flutter}C540 330 555 354 589 352Z`);
    nodes['scarf-lower'].setAttribute('d',`M586 342Q537 349 521 ${380+flutter/2}L506 ${390+flutter/2} 529 ${393+flutter/2} 526 ${411+flutter/2}Q545 403 549 383L591 357Z`);
  }
  function tick(now) {
    if(lastTime !== null) elapsed += Math.min((now-lastTime)/1000,.05);
    lastTime = now;
    draw(elapsed);
    raf = requestAnimationFrame(tick);
  }
  function updatePlayback() {
    const button=byId('play-button'), label=paused?'继续骑行':'暂停骑行';
    button.setAttribute('aria-label',label);button.title=label;
    button.setAttribute('aria-pressed',String(paused));
    byId('play-icon').setAttribute('d',paused?'M7 4l14 8-14 8Z':'M7 5h3v14H7zm7 0h3v14h-3z');
    cancelAnimationFrame(raf);lastTime=null;
    if(!paused && !document.hidden) raf=requestAnimationFrame(tick);
  }
  byId('play-button').addEventListener('click',()=>{paused=!paused;updatePlayback();byId('status').textContent=paused?'骑行已暂停':'继续迎风骑行';});
  document.addEventListener('visibilitychange',updatePlayback);
  reduced.addEventListener('change',event=>{paused=event.matches;updatePlayback();});
  async function ring() {
    const now=performance.now();if(now-bellTime<250)return;bellTime=now;
    byId('status').textContent='叮铃！好心情正在路上。';
    nodes['bell-rings'].getAnimations().forEach(animation=>animation.cancel());
    nodes['bell-rings'].animate([{opacity:0},{opacity:1,offset:.12},{opacity:.4,offset:.42},{opacity:1,offset:.6},{opacity:0}],{duration:800});
    try {
      const AudioEngine=window.AudioContext||window.webkitAudioContext;
      if(!AudioEngine)return;
      audioContext ||= new AudioEngine();
      await audioContext.resume();
      const start=audioContext.currentTime;
      for(const delay of [0,.16]) {
        [[1568,.14],[2352,.045],[3136,.025]].forEach(([frequency,volume])=>{
          const oscillator=audioContext.createOscillator(), gain=audioContext.createGain();
          oscillator.type='sine';oscillator.frequency.value=frequency;
          gain.gain.setValueAtTime(.0001,start+delay);
          gain.gain.exponentialRampToValueAtTime(volume,start+delay+.006);
          gain.gain.exponentialRampToValueAtTime(.0001,start+delay+.85);
          oscillator.connect(gain);gain.connect(audioContext.destination);
          oscillator.start(start+delay);oscillator.stop(start+delay+.9);
          oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};
        });
      }
    } catch (_) { /* Visual bell feedback remains available without audio. */ }
  }
  byId('ring-button').addEventListener('click',ring);
  byId('bell').addEventListener('click',ring);
  byId('bell').addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();ring();}});
  draw(.12);updatePlayback();
})();
</script>
</body>
</html>
